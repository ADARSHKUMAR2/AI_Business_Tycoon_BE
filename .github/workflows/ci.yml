name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build backend image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Lint gateway authentication changes
        run: uv run --locked ruff check gateway/routes/proxy_router.py tests/test_gateway_proxy_auth.py

      - name: Run tests
        run: uv run --locked pytest -q

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build container image (no push)
        run: >-
          docker buildx build
          --platform linux/amd64
          --build-arg UV_INDEX_URL=https://pypi.org/simple
          --tag ai-business-tycoon-backend:ci
          --load
          .

      - name: Verify gateway runtime imports in image
        run: >-
          docker run --rm --platform linux/amd64 --entrypoint uv
          ai-business-tycoon-backend:ci
          run --no-sync python -c
          "import google.auth.transport.requests; import gateway.routes.proxy_router; print('gateway imports OK')"