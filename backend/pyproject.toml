[project]
name = "ai-business-tycoon-backend"
version = "0.1.0"
description = "AI Business Tycoon Backend - Phase 1 POC"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.3",
    "httpx>=0.25.2",
    "honcho>=2.0.0",
    "pytest-asyncio>=0.21.1",
    "black>=23.12.0",
    "ruff>=0.1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# This tells hatchling which custom directories to include in the build
packages = ["gateway", "services", "shared"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project.scripts]
dev = "scripts:start_all"
dev-gateway = "scripts:start_gateway"
dev-auth = "scripts:start_auth"
dev-game = "scripts:start_game"

